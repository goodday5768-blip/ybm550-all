<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토익 550+ 워크북</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#dde1e8;--acc:#2f5bb7;--acc2:#e8eefb;--ok:#1e8a4c;--okb:#e5f5ec;--ng:#c2392b;--ngb:#fbe9e7;--sh:0 1px 3px rgba(20,30,50,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1b1e24;--ink:#e6e8ee;--mute:#9aa1b0;--line:#2c313a;--acc:#7da2f0;--acc2:#1f2a40;--ok:#4cc27f;--okb:#183325;--ng:#ef7d70;--ngb:#3a1d1a;--sh:none}}
:root[data-theme="dark"]{--bg:#121418;--card:#1b1e24;--ink:#e6e8ee;--mute:#9aa1b0;--line:#2c313a;--acc:#7da2f0;--acc2:#1f2a40;--ok:#4cc27f;--okb:#183325;--ng:#ef7d70;--ngb:#3a1d1a;--sh:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(15px*var(--fz,1))/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 80px}
h1{font-size:calc(22px*var(--fz,1));margin:8px 0 2px}
.sub{color:var(--mute);font-size:calc(13px*var(--fz,1));margin:0 0 14px}
.note{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:calc(14px*var(--fz,1));margin-bottom:14px}
.part{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 0;margin:0 0 12px;box-shadow:var(--sh)}
.part h2{font-size:calc(15px*var(--fz,1));margin:6px 14px 4px;color:var(--acc)}
.deck{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 14px;color:var(--ink);font:inherit;cursor:pointer}
.deck:first-of-type{border-top:0}
.deck .t{flex:1}
.deck .m{color:var(--mute);font-size:calc(12px*var(--fz,1));white-space:nowrap}
.deck .bar{width:54px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.deck .bar i{display:block;height:100%;background:var(--ok)}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top .t{flex:1;font-weight:700;font-size:calc(15px*var(--fz,1));min-width:150px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:6px 11px;font:inherit;font-size:calc(13px*var(--fz,1));cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.score{font-size:calc(13px*var(--fz,1));color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:14px 0;overflow:hidden;box-shadow:var(--sh)}
.sl{position:relative;width:100%;background:#fff}
.sl img{display:block;width:100%;height:auto}
.sl .ov{position:absolute;display:none}
.card.show .sl .ov{display:block}
.meta{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:calc(12px*var(--fz,1));color:var(--mute);border-top:1px solid var(--line);flex-wrap:wrap}
.meta .sp{flex:1}
audio{width:100%;display:block;margin:0;padding:6px 12px 0}
.qrow{padding:8px 12px;border-top:1px dashed var(--line)}
.qrow .lab{font-size:calc(13px*var(--fz,1));font-weight:700;margin-right:6px}
.ch{display:inline-block;min-width:46px;margin:3px 4px 3px 0;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font:inherit;font-size:calc(14px*var(--fz,1));cursor:pointer}
.ch.sel{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:700}
.ch.ok{background:var(--okb);border-color:var(--ok);color:var(--ok);font-weight:700}
.ch.ng{background:var(--ngb);border-color:var(--ng);color:var(--ng)}
.ex{white-space:pre-line;font-size:calc(13.5px*var(--fz,1));margin:8px 0 2px;padding:9px 11px;border-left:3px solid var(--acc);background:var(--acc2);border-radius:0 8px 8px 0;display:none}
.card.show .ex,.qrow.done .ex{display:block}
.res{font-size:calc(13px*var(--fz,1));font-weight:700;margin-left:4px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
.hidden{display:none}
</style>

/* 콘텐츠 보호(2026-10-06) — 공용 조각(examapp/unlock.js). 빌더(content_crypt.inject)가 각 틀의 UNLOCK 표식 자리에 넣는다.
   D.enc = base64(iv + AES-256-GCM(gzip JSON)). 열쇠(16진수 64자)는 서버 start 응답 g.key 또는 이 기기에 저장된 값.
   UNLOCK.run(D, g, st[, target]): {ok:true, key}면 풀린 내용이 target(기본 D)에 합쳐진 뒤, {ok:false, msg}면 msg를 학생에게 보인다.
   st = {get(), set(v), del()} 열쇠 저장소(엔진마다 localStorage 이름공간이 달라 밖에서 준다). D.enc가 없는 옛 페이지는 그대로 통과.
   그림: <img data-enc="경로.bin"> 을 UNLOCK.lazy(root, cryptoKey)가 보일 때 받아 풀어 blob 주소로 넣는다(.bin이 아니면 그대로 src).
   음원(2026-11-02): <audio data-enc="경로.bin" data-type="audio/mp4"> 도 같은 방식(보일 때 받아 풀어 src). */
const UNLOCK = (() => {
  const hex2b = h => Uint8Array.from(String(h || '').match(/../g) || [], x => parseInt(x, 16));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function keyOf(hex) { return crypto.subtle.importKey('raw', hex2b(hex), 'AES-GCM', false, ['decrypt']); }
  async function openBytes(key, buf) {   // key: CryptoKey, buf: ArrayBuffer|Uint8Array(iv + 본문) → ArrayBuffer
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    return crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12));
  }
  async function open(keyHex, encB64) {
    const plain = await openBytes(await keyOf(keyHex), b64(encB64));
    const s = new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(await new Response(s).text());
  }
  const MSG_NET = '처음 쓰는 기기는 인터넷 연결이 필요합니다. 통신 상태를 확인한 뒤 다시 시도하세요.';
  const MSG_SRV = '지금은 시작할 수 없습니다. 선생님께 문의하세요.';
  const MSG_FAIL = '내용을 여는 데 실패했습니다. 앱을 새로 고친 뒤 다시 시도하세요.';
  const MSG_OLD = '이 브라우저에서는 열 수 없습니다. 최신 Safari 또는 Chrome으로 여세요.';
  const able = () => !!(window.isSecureContext && window.crypto && crypto.subtle && typeof DecompressionStream !== 'undefined');
  async function run(D, g, st, target) {
    if (!D.enc) return {ok: true};
    if (!able()) return {ok: false, msg: MSG_OLD};
    const fresh = g && typeof g.key === 'string' && g.key.length === 64 ? g.key : '';
    const saved = st.get() || '';
    const tries = []; if (fresh) tries.push(fresh); if (saved && saved !== fresh) tries.push(saved);
    if (!tries.length) return {ok: false, msg: g && g.nokey ? MSG_SRV : MSG_NET};
    for (const k of tries) {
      try { const obj = await open(k, D.enc); Object.assign(target || D, obj); D.enc = ''; st.set(k); return {ok: true, key: k}; }
      catch (e) { if (k === saved) st.del(); }
    }
    return {ok: false, msg: MSG_FAIL};
  }
  const urls = new Map();   // 경로 → blob 주소(한 번 푼 그림은 다시 받지 않는다)
  async function imgUrl(key, path, type) {
    if (!key || !/\.bin$/.test(path)) return path;
    if (urls.has(path)) return urls.get(path);
    const p = (async () => {
      const r = await fetch(path); if (!r.ok) throw new Error('http ' + r.status);
      const buf = await openBytes(key, await r.arrayBuffer());
      return URL.createObjectURL(new Blob([buf], {type: type || 'image/webp'}));
    })();
    urls.set(path, p);
    try { const u = await p; urls.set(path, u); return u; } catch (e) { urls.delete(path); throw e; }
  }
  let io = null; const pend = new WeakMap();
  function lazy(root, key) {   // root 안의 img[data-enc]·audio[data-enc]를 화면에 보일 때 받아 넣는다
    const load = el => { if (el.dataset.done) return; el.dataset.done = '1'; const au = el.tagName === 'AUDIO';
      imgUrl(key, el.dataset.enc, el.dataset.type || (au ? 'audio/mp4' : '')).then(u => { el.src = u; })
        .catch(() => { if (au) el.insertAdjacentHTML('afterend', '<div class="muted">음원을 받지 못했습니다. 통신 상태를 확인하세요.</div>'); else el.alt = '그림을 받지 못했습니다'; }); };
    if (!('IntersectionObserver' in window)) { root.querySelectorAll('img[data-enc], audio[data-enc]').forEach(load); return; }
    if (!io) io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); (pend.get(e.target) || load)(e.target); } }), {rootMargin: '600px 0px'});
    root.querySelectorAll('img[data-enc], audio[data-enc]').forEach(img => { pend.set(img, load); io.observe(img); });
  }
  const SIGN_FIELDS = ['name', 'device', 'score', 'correct', 'total', 'pass', 'time'];
  const canon = b => SIGN_FIELDS.map(k => b[k] === undefined || b[k] === null ? '' : String(b[k])).join('|');
  async function signBody(keyHex, body) {   // 기록 서명(2026-10-08): 채점 기록을 앱 열쇠로 HMAC-SHA256 → 서버가 검증, 위조 기록·가짜 합격 문자 차단
    const k = await crypto.subtle.importKey('raw', hex2b(keyHex), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);
    const sig = await crypto.subtle.sign('HMAC', k, new TextEncoder().encode(canon(body)));
    return Array.from(new Uint8Array(sig), x => x.toString(16).padStart(2, '0')).join('');
  }
  return {run, open, openBytes, keyOf, hex2b, able, imgUrl, lazy, signBody, canon};

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('wb550:' + k) || '{}'); } catch (e) { return {}; } },
  set(k, v) { try { localStorage.setItem('wb550:' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('wb550:' + k); } catch (e) {} },          // 초기화 단추(2026-10-03)

/* 한 쪽(슬라이드)의 문항을 모두 골라야 채점·정답 공개 (2026-10-03 사용자: 1번만 고르면 2번 답까지 드러난다) */
function full(a, s, i) { return !!(s.q && s.q.length) && s.q.every((q, j) => a[i + '_' + j] !== undefined); }
const WAIT = '<span class="res" style="color:var(--mute)">고름 · 이 쪽 문항을 모두 고르면 채점</span>';
function done(d) { const a = store.get(d.k); let ok = 0, n = 0; d.s.forEach((s, i) => { if (!full(a, s, i)) return; s.q.forEach((q, j) => { n++; if (a[i + '_' + j] === q[2]) ok++; }); }); return {ok, n}; }

function home() {
  const byPart = {};

  let h = `<h1>YBM 토익 550+ 워크북</h1><p class="sub">ETS 토익 단기공략 550+ (2026) · 교재 화면 그대로 · PART 1~7</p>
  <div class="note">교재 각 Unit을 <b>쪽 순서 그대로</b> 봅니다. 정답은 가려져 있어요 — 문제 아래 <b>(A)~(D)</b>를 고르세요 — 한 쪽의 문항을 <b>모두 고르면</b> 채점되고 정답·해설이 나오며, <b>정답 보기</b>를 누르면 교재의 정답 표시가 드러납니다. 🔊가 있는 쪽은 음원을 들으며 푸세요(이어폰 권장). 푼 기록은 이 기기에 저장되고, Unit 위쪽 <b>기록 지우기</b>나 목차 맨 아래 <b>푼 기록 모두 지우기</b>로 지울 수 있습니다.</div>`;

      return `<button class="deck" data-i="${i}"><span class="t">${esc(d.name)}</span><span class="m">${d.s.length}쪽${pg}${n ? ` · ${r.ok}/${n}` : ''}</span>${n ? `<span class="bar"><i style="width:${Math.round(100 * r.ok / n)}%"></i></span>` : ''}</button>`;

function deck(i) {
  const d = D.decks[i], ans = store.get(d.k);
  let h = `<div class="top"><button class="btn" id="back">‹ 목차</button><span class="t">${esc(d.name)}</span><span class="score" id="score"></span><button class="btn" id="reset">기록 지우기</button><button class="btn" id="all">정답 모두 보기</button></div>`;
  d.s.forEach((s, si) => {
    const ov = s.ov ? `<img class="ov" data-enc="wb/${d.k}/${String(s.n).padStart(3, '0')}a.bin" style="left:${s.ov[0]}%;top:${s.ov[1]}%;width:${s.ov[2]}%" alt="">` : '';
    h += `<div class="card" id="c${si}"><div class="sl" style="aspect-ratio:${1 / d.h}"><img data-enc="wb/${d.k}/${String(s.n).padStart(3, '0')}.bin" alt="${esc(d.name)} ${s.n}쪽">${ov}</div>`;

    const fl = full(ans, s, si);

      const lab = q[0] != null ? `${q[0]}번` : (s.q.length > 1 ? `${qi + 1})` : '정답');
      const res = v === undefined ? (pv !== undefined ? WAIT : '') : (v === q[2] ? '<span class="res" style="color:var(--ok)">맞음</span>' : '<span class="res" style="color:var(--ng)">틀림</span>');
      h += `<div class="qrow${v !== undefined ? ' done' : ''}" data-s="${si}" data-q="${qi}"><span class="lab">${esc(lab)}</span>${btns}${res}<div class="ex">${esc(q[3] || '정답 (' + L[q[2]] + ')')}</div></div>`;
    });

    h += `<div class="meta"><span>${s.n} / ${d.s.length}쪽${s.p ? ' · 교재 p.' + s.p : ''}</span><span class="sp"></span>${tog}</div></div>`;

  h += `<div class="nav">${prev ? `<button class="btn" id="prev">‹ ${esc(prev.name)}</button>` : '<span></span>'}${next ? `<button class="btn pri" id="next">${esc(next.name)} ›</button>` : ''}</div>`;
  $('#app').innerHTML = h; UNLOCK.lazy($('#app'), IMGKEY);

function route() {
  const k = decodeURIComponent(location.hash.replace(/^#\/?/, ''));
  const i = D.decks.findIndex(d => d.k === k);
  if (i >= 0) deck(i); else home();

// ---- 콘텐츠 보호(2026-10-06): 교재 쪽 그림·문항·정답은 암호문. 시험 앱(index.html)과 같은 이름공간 ex:<salt>: 에서 이름·동의·기기ID·열쇠를 함께 쓴다 ----
const NS = 'ex:' + D.salt + ':';
const exst = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const KEYST = {get: () => exst.get('k', ''), set: v => exst.set('k', v), del: () => exst.set('k', '')};
const pad = n => String(n).padStart(2, '0');
const fmtTime = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const cleanName = s => s.replace(/\s+/g, ' ').trim();
const DEVICE = (() => { let d = exst.get('device', ''); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random()).slice(0, 8); exst.set('device', d); } return d; })();
let IMGKEY = null;
async function gate(name, range) {     // 시험 앱과 같은 시작 판정(이름·기기ID 짝, apps_script checkDevice) + 열쇠
  if (!D.reportUrl) return {allow: true};
  for (let i = 0; i < 2; i++) {
    if (i) { const m = document.getElementById('msg'); if (m) m.textContent = '서버 응답이 늦어 한 번 더 확인하는 중…'; }
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
    try {
      const r = await fetch(D.reportUrl, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({event: 'start', name, range, device: DEVICE, app: D.title, salt: D.enc ? D.salt : undefined, time: fmtTime(new Date()), ua: navigator.userAgent.slice(0, 120)})});
      const txt = await r.text();
      try { const j = JSON.parse(txt); return typeof j.allow === 'boolean' ? j : {allow: true}; } catch (e) { return {allow: true, legacy: true}; }
    } catch (e) { if (i) return {allow: false, offline: true}; await new Promise(res => setTimeout(res, 1500)); }
    finally { clearTimeout(t); }
  }
}
function nameOk() {
  const name = cleanName($('#name').value);
  if (!name) { $('#msg').textContent = '이름을 먼저 입력하세요.'; $('#name').focus(); window.scrollTo(0, 0); return false; }
  if (window.LEESS && !LEESS.ok(name)) { $('#msg').textContent = LEESS.msg(); $('#name').focus(); window.scrollTo(0, 0); return false; } /*LEESS*/
  exst.set('name', name); $('#msg').textContent = ''; return true;
}
function renderLocked() {
  let saved = exst.get('name', ''); try { saved = saved || localStorage.getItem('leess-vname') || ''; } catch (e) {}
  $('#app').innerHTML = `<h1>${esc(D.title)}</h1><p class="sub">${esc(D.sub || '')}</p>
  <div class="note"><b>워크북 열기</b><p style="margin:6px 0 10px">본인 이름(실명)을 쓰고 「워크북 열기」를 누르세요. 처음 쓰는 기기는 인터넷 연결이 필요합니다.</p>
  <input type="text" id="name" placeholder="이름 (필수)" autocomplete="off" value="${esc(saved)}" style="width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)">
  <div id="consentCard" hidden style="margin-top:10px;font-size:calc(13.5px*var(--fz,1));line-height:1.6"><b>개인정보 수집·이용 동의</b><p style="margin:6px 0 8px">${D.consent || ''}</p><button class="btn pri" id="consentOk">동의하고 열기</button> <button class="btn" id="consentNo">동의하지 않음</button></div>
  <p id="msg" style="color:var(--ng);font-size:calc(14px*var(--fz,1));min-height:1.4em;margin:8px 0"></p>
  <button class="btn pri" id="openWb" style="width:100%;padding:10px">워크북 열기</button></div>`;
  $('#openWb').onclick = openWb;
  $('#consentOk').onclick = () => { if (!nameOk()) return; exst.set('consent', fmtTime(new Date())); $('#consentCard').hidden = true; openWb(); };
  $('#consentNo').onclick = () => { $('#consentCard').hidden = true; $('#msg').textContent = '동의하지 않으면 이 워크북을 이용할 수 없습니다.'; };
}
async function openWb() {
  if (!nameOk()) return;
  if (D.consent && !exst.get('consent', '')) { $('#consentCard').hidden = false; return; }
  $('#msg').textContent = '서버에서 이름·기기를 확인하는 중…'; $('#openWb').disabled = true;
  const g = await gate(exst.get('name', ''), '워크북 열기');
  $('#openWb').disabled = false;
  if (!g.allow) { $('#msg').textContent = g.offline ? '서버에 연결하지 못했습니다. 통신 상태를 확인한 뒤 다시 시도하세요.' : (g.msg || '이 기기에서는 시작할 수 없습니다. 선생님께 문의하세요.'); return; }
  const u = await UNLOCK.run(D, g, KEYST);
  if (!u.ok) { $('#msg').textContent = u.msg; return; }
  if (u.key) IMGKEY = await UNLOCK.keyOf(u.key);
  boot();
}
async function boot() {
  if (D.enc) { const u = await UNLOCK.run(D, null, KEYST); if (!u.ok) { renderLocked(); return; } if (u.key) IMGKEY = await UNLOCK.keyOf(u.key); }

<script id="bookNoteJs">/* 범용 필기층(2026-11-09) — 시험앱 전용 필기(note.js)를 끼울 수 없는 모든 화면에 붙는다: 교재·지문분석(article), EBS·수업관리 시험(#qs), 워크북(#stepBox·#exs),
   교사용 교재(.page 쪽 그림), 최종정리(#root). 화면 코드는 고치지 않고 body 변화를 보고 스스로 붙는다. 저장은 기기 IndexedDB(note.js와 같은 DB), 내용은 저장하지 않고 획만.
   필기는 펜슬만(손가락·마우스는 넘기기·단어 선택 그대로). 글 카드는 내용 해시로, 쪽 그림은 쪽 번호로, 교재 지문은 id로 찾는다. 휴대폰(640 이하)과 넓은 화면은 글 배치가 달라 따로 저장. */
(() => {
  if (window.BOOKNOTE || document.getElementById('noteJs')) return;   // 시험앱 전용 필기가 있으면 그쪽이 맡는다
  const DBN = 'exnote', ST = 'rounds', COL = ['#e53935', '#1e66f5'], HCOL = ['#ffd60a', '#4cd964', '#ff7ab8'], HINT = '필기는 펜슬로만', ERASE_R = 12, TAP_PX = 6, TAP_MS = 300, MAX_SCALE = 1.5, OLD = 200 * 864e5;
  const $ = s => document.querySelector(s);
  let salt0 = ''; try { if (typeof D !== 'undefined' && D && D.salt) salt0 = String(D.salt); } catch (e) {}
  const QS = new URLSearchParams(location.search), BOOK = QS.get('b') || '';
  const SALT = 'book:' + (salt0 || location.pathname.replace(/[^/]*$/, '')), PAGE = (location.pathname.split('/').pop() || 'guide').replace(/\.html$/, ''), NARROW = matchMedia('(max-width:640px)');
  const css = document.createElement('style');
  css.textContent = `.bn-rel{position:relative}
.bn-l{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:1}
.bn-l path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:2.2}
.bn-l path.hl{stroke-width:16;stroke-opacity:.38}
#bnBar{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;display:flex;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 20px);box-sizing:border-box;gap:5px;align-items:center;padding:5px;background:rgba(255,255,255,.96);border:1px solid rgba(0,0,0,.14);border-radius:14px;box-shadow:0 3px 14px rgba(0,0,0,.2);color:#222;font-size:14px}
#bnBar[hidden]{display:none}
#bnBar button{min-height:38px;width:auto;margin:0;padding:8px 10px;border:1px solid rgba(0,0,0,.16);border-radius:9px;background:#fff;color:#222;font:inherit;line-height:1}
#bnBar button.on{outline:2px solid #1e66f5;outline-offset:-2px;font-weight:700}
#bnBar .bn-dot{width:38px;padding:0;display:flex;align-items:center;justify-content:center}

#bnBar .bn-dot[hidden]{display:none}
#bnSt{font-size:11px;color:#777;min-width:0;white-space:nowrap}
body.bn-pen{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body.bn-pen img{-webkit-user-drag:none}
@media print{#bnBar{display:none}}`;
  document.head.appendChild(css);
